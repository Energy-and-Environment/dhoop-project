<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dhoop Project Desk</title>
<meta name="description" content="Solar project delivery desk for residential, commercial and industrial installations: pipeline, tasks, payments, margins, quick quotes and client updates.">
<meta name="theme-color" content="#d97a00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23d97a00'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23d97a00' stroke-width='2' stroke-dasharray='3 3.8'/%3E%3C/svg%3E">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f2f5f7; --surface:#ffffff; --surface2:#e9eef2; --ink:#13202b; --muted:#566878; --line:#d8e0e6;
  --accent:#d97a00; --accent-ink:#ffffff; --accent-soft:#fdeed8; --teal:#0c6b74; --teal-soft:#dcf0f1;
  --good:#1e7b4a; --good-soft:#dff3e7; --warn:#a86300; --warn-soft:#fcefd2; --bad:#b3352c; --bad-soft:#fbe4e1;
  --shadow:0 1px 2px rgba(19,32,43,.06),0 8px 24px rgba(19,32,43,.08);
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f171d; --surface:#172129; --surface2:#1f2b34; --ink:#e7eef3; --muted:#93a4b2; --line:#2a3944;
  --accent:#f0a024; --accent-ink:#1a1204; --accent-soft:#3a2a10; --teal:#4cc0c9; --teal-soft:#123a3e;
  --good:#5fd394; --good-soft:#12321f; --warn:#f0b955; --warn-soft:#3a2c0d; --bad:#ff8a80; --bad-soft:#40201d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f171d; --surface:#172129; --surface2:#1f2b34; --ink:#e7eef3; --muted:#93a4b2; --line:#2a3944;
  --accent:#f0a024; --accent-ink:#1a1204; --accent-soft:#3a2a10; --teal:#4cc0c9; --teal-soft:#123a3e;
  --good:#5fd394; --good-soft:#12321f; --warn:#f0b955; --warn-soft:#3a2c0d; --bad:#ff8a80; --bad-soft:#40201d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 0;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:700}
.brand span{color:var(--muted);font-size:12px}
.sun{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);margin-right:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

main{padding-block:20px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.sync{font-size:12px;color:var(--muted);cursor:pointer}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.kpi{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.2;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)}

.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;margin-top:20px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h3{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h3 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12px}

/* stage funnel */
.frow{display:grid;grid-template-columns:130px 1fr 96px;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.frow .bar{height:14px;background:var(--surface2);border-radius:3px;overflow:hidden}
.frow .bar i{display:block;height:100%;background:var(--teal);border-radius:3px}
.frow.cur .bar i{background:var(--accent)}
.frow .c{text-align:right;color:var(--muted);font-size:12px}
@media(max-width:480px){.frow{grid-template-columns:100px 1fr 74px}}

.split{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--surface2);margin:6px 0 8px}
.split i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.c-res{background:var(--teal)} .c-com{background:var(--accent)} .c-ind{background:#6a7fb5}
:root[data-theme="dark"] .c-ind{background:#8fa4de}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .c-ind{background:#8fa4de}}

/* lists */
.item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}
.item:hover .t{color:var(--teal)}
.t{font-weight:500}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;font-weight:500;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill.res{background:var(--teal-soft);color:var(--teal)}
.pill.com{background:var(--accent-soft);color:var(--warn)}
.pill.ind{background:var(--surface2);color:var(--ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)}

/* board */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools input[type=search],.tools select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 268px;background:var(--surface2);border-radius:10px;padding:10px}
.col h4{margin:2px 4px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;justify-content:space-between;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.card:hover{border-color:var(--teal)}
.card .n{font-weight:600;line-height:1.3}
.card .m{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);margin-top:4px}
.prog{height:5px;background:var(--surface2);border-radius:3px;margin-top:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good)}
.flags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}

/* tasks */
.trow{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow input{margin-top:3px;width:16px;height:16px;accent-color:var(--teal)}
.trow.done .tx{text-decoration:line-through;color:var(--muted)}
.trow .sub{font-size:12px;color:var(--muted)}
.trow .sub a{color:var(--teal);cursor:pointer;text-decoration:underline}
.gh{font-family:var(--f-display);font-size:14px;margin:18px 0 4px;display:flex;gap:8px;align-items:center}
.gh:first-child{margin-top:0}

/* forms */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f input,label.f select,label.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--ink);font-size:14px;width:100%}
textarea{resize:vertical;min-height:80px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:16px}
.res-grid .r .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.res-grid .r .v{font-family:var(--f-display);font-size:24px;font-weight:700}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,14,19,.5);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:var(--shadow);padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(40px + env(safe-area-inset-bottom,0px))}
.drawer h2{font-size:22px}
.dhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:13px;margin:10px 0 4px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.steps{display:flex;gap:3px;margin:14px 0 6px}
.steps button{flex:1;height:8px;border:0;border-radius:2px;background:var(--surface2);cursor:pointer;padding:0}
.steps button.on{background:var(--teal)}
.steps button.cur{background:var(--accent)}
.sec{margin-top:22px}
.sec h3{font-size:15px;margin-bottom:6px}
.pay{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.pay:first-of-type{border-top:0}
.addtask{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.addtask input{flex:1 1 180px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px}

.crow{display:grid;grid-template-columns:minmax(0,1fr) 104px 104px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
.crow.h{border-top:0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.crow input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;text-align:right;font-family:var(--f-mono);font-size:13px}
.msgbox{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;min-height:130px;margin-top:10px;line-height:1.5}
a.btn{display:inline-block;text-decoration:none}
/* playbook */
.pb{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.pb ul,.pb ol{margin:6px 0 0;padding-left:18px}
.pb li{margin:4px 0}
.gate{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.gate:first-of-type{border-top:0}
.gate b{font-weight:600}
.tblwrap{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;font-size:13px}
@media(max-width:560px){.gate{grid-template-columns:1fr;gap:2px}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
.res-grid .r .v.sm{font-size:18px}
.note{font-size:12px;color:var(--muted);margin:14px 0 0;border-left:3px solid var(--accent);padding-left:10px}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <div class="top-row">
    <div class="brand"><span class="sun"></span><b>Dhoop Project Desk</b><span>Solar delivery for homes, shops and factories</span></div>
    <div style="display:flex;gap:10px;align-items:center"><span class="sync" id="sync" data-act="reconnect" title="Database sync status — click to reconnect"></span><button class="btn ghost sm" data-act="backup" title="Download all data as a file">Backup</button><label class="btn ghost sm" title="Load data from a backup file">Restore<input type="file" id="restore" accept=".json,application/json" hidden></label><button class="btn" data-act="new">+ New project</button></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div></div>
<main class="wrap" id="app"></main>
<div id="overlay"></div>

<script>
"use strict";
/* ---------- constants ---------- */
const STAGES=[
 {k:"lead",n:"Lead",sla:3,t:[["Call client within 24 hours and qualify (bill, roof, budget)","Sales",1],["Collect latest electricity bill and CNIC copy","Sales",3]]},
 {k:"survey",n:"Site survey",sla:5,t:[["Site visit: roof type, direction and shading","Survey team",3],["Measure roof area, take photos, check DB and earthing","Survey team",3]]},
 {k:"design",n:"Design & BOQ",sla:5,t:[["System sizing and single-line diagram","Design",3],["Prepare BOQ with panel and inverter options","Design",4],["Roof structure and load check (commercial / industrial)","Design",4]]},
 {k:"quote",n:"Quotation",sla:7,t:[["Send quotation by PDF and WhatsApp","Sales",1],["Follow up, negotiate and get written approval","Sales",7]]},
 {k:"contract",n:"Contract & advance",sla:5,t:[["Sign agreement with warranty and payment terms","Sales",3],["Receive advance and issue receipt","Accounts",2]]},
 {k:"procure",n:"Procurement",sla:14,t:[["Place orders: panels, inverter, structure, cables","Procurement",3],["Track shipment and clear at warehouse","Procurement",10],["Quality check on delivered material","Procurement",2]]},
 {k:"install",n:"Installation",sla:10,t:[["Mount structure and panels","Install crew",4],["DC / AC cabling, earthing and lightning arrestor","Install crew",4],["Receive delivery-stage payment","Accounts",2]]},
 {k:"meter",n:"DISCO / net metering",sla:45,t:[["Submit net metering application to the DISCO","DISCO liaison",3],["DISCO site inspection and approval","DISCO liaison",21],["Bi-directional meter installed","DISCO liaison",21]]},
 {k:"commission",n:"Commissioning",sla:4,t:[["Inverter commissioning and monitoring app setup","Install crew",1],["Performance test and client walkthrough","Design",2]]},
 {k:"handover",n:"Handover & AMC",sla:14,t:[["Handover pack: warranty cards, manuals, as-built drawings","Design",3],["Collect final payment","Accounts",5],["Schedule first cleaning / AMC visit and ask for review","Sales",30]]}
];
const ROLES=["Sales","Survey team","Design","Procurement","Install crew","DISCO liaison","Accounts"];
const CITIES={Lahore:"LESCO",Karachi:"K-Electric",Islamabad:"IESCO",Rawalpindi:"IESCO",Faisalabad:"FESCO",Multan:"MEPCO",Gujranwala:"GEPCO",Peshawar:"PESCO",Hyderabad:"HESCO",Quetta:"QESCO",Sukkur:"SEPCO"};
const SEG={res:"Residential",com:"Commercial",ind:"Industrial"};
const TYPES={grid:"On-grid",hybrid:"Hybrid",off:"Off-grid"};
const PAY={
 res:[["Advance on approval",50,4],["On material delivery",40,6],["On commissioning",10,9]],
 com:[["Advance on approval",30,4],["On material delivery",40,5],["Installation complete",20,7],["Net metering / commissioning",10,9]],
 ind:[["Advance on approval",30,4],["On material delivery",40,5],["Installation complete",20,7],["Net metering / commissioning",10,9]]
};

/* cost categories: label, share of price (residential), stage from which the actual cost is known */
const COSTS=[["Panels",.33,5],["Inverter / batteries",.17,5],["Structure & mounting",.10,5],["Cables & BOS",.08,5],["Labour",.06,7],["Transport & logistics",.02,7],["DISCO & fees",.02,8],["Other",.02,8]];
const COSTF={res:1,com:1.025,ind:1.06};
/* WhatsApp templates, one per stage. {c} client, {p} project, {kw} size, {d} DISCO, {due} next payment */
const MSG={
 en:[
  "Assalam o Alaikum {c}, thank you for your interest in solar. To size your system we need your latest electricity bill and a convenient time for a site visit. Please share both when you can.",
  "Assalam o Alaikum {c}, our engineer will visit for the site survey of {p}. He will check the roof, shading and distribution board and take measurements. Please make sure roof access is available.",
  "Assalam o Alaikum {c}, the survey for {p} is done. We are preparing the design and bill of quantities for {kw} kW and will send your quotation within a few days.",
  "Assalam o Alaikum {c}, your quotation for the {kw} kW system is ready. It lists the equipment, warranty and payment terms. Please review it and tell us if you want any change.",
  "Thank you {c}. We have received your signed agreement and advance, and {p} is now confirmed. Next we order the equipment. Advance receipt is with you.",
  "Update on {p}: your equipment has been ordered and is on its way. We will check it on arrival and confirm the installation date with you.",
  "Installation of your {kw} kW system has started. Our crew will be at the site; please keep the roof and meter room accessible. Payment due at this stage: {due}.",
  "Your system at {p} is installed. We have submitted the net metering file to {d}. Approval and the meter change are done by {d} and can take several weeks. We will follow up every week and keep you posted.",
  "{c}, your system is ready to switch on. We will commission the inverter, set up the monitoring app on your phone and walk you through it. Which day suits you?",
  "Congratulations {c}, {p} is complete. Your warranty cards, manuals and drawings are in the handover pack. Final payment due: {due}. We will visit soon for the first cleaning check. If you are happy with our work, a review would help us a lot."
 ],
 ur:[
  "Assalam o Alaikum {c}, solar mein dilchaspi ka shukriya. System ka size tay karne ke liye humein aap ka latest bijli ka bill aur site visit ka munasib waqt chahiye. Barae meherbani dono share kar dein.",
  "Assalam o Alaikum {c}, hamara engineer {p} ke site survey ke liye aayega. Woh chhat, saya aur distribution board check karega aur paimaish lega. Barae meherbani chhat tak rasai rakhein.",
  "Assalam o Alaikum {c}, {p} ka survey mukammal ho gaya hai. Hum {kw} kW ka design aur BOQ tayyar kar rahe hain aur chand din mein quotation bhej denge.",
  "Assalam o Alaikum {c}, {kw} kW system ki quotation tayyar hai. Us mein equipment, warranty aur payment ki shara'it hain. Dekh kar bata dein agar koi tabdeeli chahiye.",
  "Shukriya {c}. Aap ka dastkhat shuda agreement aur advance mil gaya hai, {p} confirm ho gaya hai. Ab hum equipment order karenge.",
  "{p} ke bare mein update: aap ka equipment order ho chuka hai aur raste mein hai. Pahunchne par check kar ke installation ki tareekh confirm karenge.",
  "Aap ke {kw} kW system ki installation shuru ho gayi hai. Hamari team site par hogi; chhat aur meter room tak rasai rakhein. Is marhale ki payment: {due}.",
  "{p} ka system lag gaya hai. Net metering ki file {d} mein jama kara di hai. Manzoori aur meter ki tabdeeli {d} karta hai aur kuch haftay lag sakte hain. Hum har hafte follow up kar ke aap ko batate rahenge.",
  "{c}, aap ka system chalane ke liye tayyar hai. Hum inverter commission karenge, phone par monitoring app lagayenge aur samjha denge. Kaunsa din munasib rahega?",
  "Mubarak ho {c}, {p} mukammal hai. Warranty cards, manuals aur drawings handover pack mein hain. Aakhri payment: {due}. Pehli safai check ke liye jald visit karenge. Agar aap hamare kaam se khush hain to review dena hamare liye bohat madadgar hoga."
 ]
};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());

function makeTasks(seg,stage,seed){
  const out=[];
  STAGES.forEach((s,si)=>{
    s.t.forEach((t,ti)=>{
      if(t[0].includes("commercial / industrial")&&seg==="res")return;
      let done=si<stage, due=addDays(t[2]+si*2-stage*2);
      if(si===stage){done=ti<(seed%2);due=addDays(((seed+ti*3)%9)-3)}
      if(si>stage){due=addDays((si-stage)*5+ti)}
      out.push({id:uid(),text:t[0],stage:si,role:t[1],due,done});
    });
  });
  return out;
}
function makePay(seg,stage,price){return PAY[seg].map(p=>({label:p[0],pct:p[1],paid:stage>=p[2]}))}
function makeCosts(seg,stage,price,seed,over){
  return COSTS.map((c,i)=>{
    const budget=Math.round(price*c[1]*COSTF[seg]/1000)*1000;
    const v=((i*7+seed*5)%11-4)/100+(over||0);
    return {label:c[0],budget,actual:stage>=c[2]?Math.round(budget*(1+v)/1000)*1000:0};
  });
}
function mkProject(o){
  const stage=o.stage??0, seg=o.seg;
  return {id:uid(),name:o.name,client:o.client,phone:o.phone||"",city:o.city,disco:CITIES[o.city]||"",seg,kw:o.kw,type:o.type||"grid",
    price:o.price,stage,stageDate:addDays(-(o.days??2)),target:addDays(o.target??30),created:addDays(-(o.age??20)),
    notes:o.notes||"",payments:makePay(seg,stage,o.price),tasks:makeTasks(seg,stage,o.seed??0),costs:makeCosts(seg,stage,o.price,o.seed??0,o.over),ex:!!o.ex};
}

function migrate(d){
  let ch=false;
  d.settings=d.settings||{};
  if(d.settings.targetMargin==null){d.settings.targetMargin=18;ch=true}
  if(d.settings.exportRate==null){d.settings.exportRate=11;ch=true}
  if(d.settings.battRate==null){d.settings.battRate=55000;ch=true}
  d.projects.forEach(p=>{
    if(!p.costs){p.costs=makeCosts(p.seg,p.stage,p.price,0,0);ch=true;if(!d.sample)p.costs.forEach(c=>c.actual=0)}
    if(p.ex==null&&d.sample){p.ex=true;ch=true}
  });
  if((d.v||1)<2){
    d.projects.push(...moreSamples());d.sample=true;d.v=2;ch=true;
  }
  return ch;
}

/* ---------- persistence ---------- */
let dbRef=false, saveTimer=null, pollTimer=null, writing=false, dirty=false;
const LS="dhoop-pms-v1", KEY="dhoop-db-key", API="/api/state";
function loadLocal(){try{const r=localStorage.getItem(LS);if(r)return JSON.parse(r)}catch(e){}return null}
function accessKey(){try{return localStorage.getItem(KEY)||""}catch(e){return ""}}
function save(){
  S.rev=uid();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,500);
  setSync();
}
async function api(method,body){
  return fetch(API,{method,headers:{"content-type":"application/json","x-dhoop-key":accessKey()},body:body?JSON.stringify(body):undefined,cache:"no-store"});
}
async function flush(){
  if(!dbRef)return;
  if(writing){dirty=true;return}
  writing=true;
  try{
    const r=await api("PUT",{state:clone(S)});
    if(r.status===401){dbRef=false;try{localStorage.removeItem(KEY)}catch(e){}setSync(false,"locked")}
    else if(!r.ok)throw new Error("http_"+r.status);
    else setSync(true);
  }catch(e){setSync(false,e&&e.message)}
  writing=false;
  if(dirty){dirty=false;flush()}
}
function setSync(ok,code){
  const el=$("#sync");if(!el)return;
  if(code==="locked")el.textContent="Database locked — click to connect";
  else if(!dbRef)el.textContent="Saved in this browser only";
  else if(ok===false)el.textContent="Not synced — click to retry";
  else el.textContent=ok?"Synced with MongoDB":"Saving…";
}
async function pullRemote(){
  if(!dbRef||writing)return;
  try{
    const r=await api("GET");
    if(r.status===401){dbRef=false;clearInterval(pollTimer);try{localStorage.removeItem(KEY)}catch(e){}setSync(false,"locked");return}
    if(!r.ok)throw new Error("http_"+r.status);
    const payload=await r.json(),d=payload.state;
    if(d&&d.rev!==S.rev){S=d;if(migrate(S))save();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}render()}
    setSync(true);
  }catch(e){setSync(false,e&&e.message)}
}
async function connectDb(ask){
  if(ask||!accessKey()){
    const key=prompt("Enter the Dhoop database access key");
    if(!key){setSync();return false}
    try{localStorage.setItem(KEY,key)}catch(e){}
  }
  try{
    const r=await api("GET");
    if(r.status===401){try{localStorage.removeItem(KEY)}catch(e){}setSync(false,"locked");if(!ask)connectDb(true);return false}
    if(!r.ok)throw new Error("http_"+r.status);
    dbRef=true;
    const payload=await r.json(),d=payload.state;
    if(d){if(d.rev!==S.rev){S=d;if(migrate(S))save();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}render()}}
    else await flush();
    clearInterval(pollTimer);pollTimer=setInterval(pullRemote,5000);setSync(true);return true;
  }catch(e){dbRef=false;setSync(false,e&&e.message);return false}
}
async function initDb(){
  if(accessKey())await connectDb(false);else setSync(false,"locked");
}

/* ---------- derived ---------- */
const open=t=>!t.done;
const overdue=t=>!t.done&&t.due<today();
const prog=p=>{const n=p.tasks.length;return n?Math.round(100*p.tasks.filter(t=>t.done).length/n):0};
const daysIn=p=>daysBetween(p.stageDate,today());
const stuck=p=>p.stage<9&&daysIn(p)>STAGES[p.stage].sla;
const nOver=p=>p.tasks.filter(overdue).length;
const collected=p=>p.payments.filter(x=>x.paid).reduce((a,x)=>a+p.price*x.pct/100,0);
const forecast=p=>p.costs.reduce((a,c)=>a+(c.actual>0?c.actual:c.budget),0);
const marginPct=p=>p.price?100*(p.price-forecast(p))/p.price:0;
const budgetMargin=p=>{const b=p.costs.reduce((a,c)=>a+c.budget,0);return p.price?100*(p.price-b)/p.price:0};
const lowMargin=p=>marginPct(p)<S.settings.targetMargin;
const isActive=p=>p.stage<9||p.tasks.some(open);

}

    <label class="f">Residential PKR per kW<input id="s-res" type="number" value="${s.rate.res}"></label>
    <label class="f">Commercial PKR per kW<input id="s-com" type="number" value="${s.rate.com}"></label>
    <label class="f">Industrial PKR per kW<input id="s-ind" type="number" value="${s.rate.ind}"></label>
    <label class="f">Units per kW per month<input id="s-upk" type="number" value="${s.unitsPerKw}"></label>
    <label class="f">Grid tariff PKR per unit<input id="s-tar" type="number" value="${s.tariff}"></label>
    <label class="f">Export buyback PKR per unit<input id="s-exp" type="number" value="${s.exportRate}"></label>
    <label class="f">Battery PKR per kWh<input id="s-bat" type="number" value="${s.battRate}"></label>
    <label class="f">Panel watts<input id="s-pw" type="number" value="${s.panelW}"></label>
    <label class="f">Target margin %<input id="s-tm" type="number" value="${s.targetMargin}"></label>
  </div><p class="small muted" style="margin:10px 0 0">These are placeholder values for planning, not market quotes. Replace them with your supplier prices and your clients' actual tariff slab. Units per kW: about 110 in the north (Peshawar, Islamabad) and up to 135 in Sindh and Balochistan. Confirm the current NEPRA buyback rate before quoting savings.</p></div>`;
}
function quoteNums(){
  const s=S.settings, off=Q.type==="off", hyb=Q.type==="hybrid";
  const daily=Q.units/30, yearUse=Q.units*12;
  /* array: meet the yearly units; off-grid is oversized to cover battery losses and poor-sun days */
  const kw=Math.max(0.5,Math.ceil((Q.units/s.unitsPerKw)*(off?OFFX:1)*2)/2);
  const panels=Math.ceil(kw*1000/s.panelW);
  /* inverter: smallest standard rating within the DC/AC limit; large plants use several 125 kW string inverters */
  const one=INV.find(x=>x*DCAC>=kw), n=Math.ceil(kw/DCAC/125);
  const inv=off?null:one?one+" kW AC":n+" × 125 kW AC";
  /* battery: hybrid covers evening load and outages (about 35% of daily units), off-grid one full day */
  const batt=off||hyb?Math.ceil(daily*(off?1:.35)/DOD/2.5)*2.5:0;
  const cost=kw*s.rate[Q.seg]+batt*s.battRate;
  const gen=kw*s.unitsPerKw*12;
  /* savings: self-used units at the retail tariff, exported units at the buyback rate (net billing) */
  const selfPct=off?100:Math.min(95,SELF[Q.seg]+(hyb?25:0));
  const used=Math.min(gen*selfPct/100,yearUse), exp=off?0:Math.max(0,gen-used);
  const save=used*s.tariff+exp*s.exportRate;
  /* footprint: module area at about 21.5% efficiency, x1.5 for row spacing and walkways on a flat roof */
  const area=Math.round(panels*(s.panelW/215)*1.5);
  return {kw,panels,inv,batt,cost,gen,used,exp,selfPct,save,pay:save?cost/save:0,area};
}
function calcQuote(){
  const r=quoteNums();const el=$("#q-out");if(!el)return;
  const rows=[["Array size",r.kw+" kWp"],["Panels",r.panels+" × "+S.settings.panelW+" W"],
    ["Inverter",r.inv||"Off-grid inverter to suit peak load"],
    ["Battery",r.batt?r.batt+" kWh LiFePO4":"None"],
    ["Roof area",r.area+" m² (about "+Math.round(r.area*10.76)+" sq ft)"],["Estimated cost",pkr(r.cost)],
    ["Yearly generation",Math.round(r.gen).toLocaleString()+" units"],
    ["Used on site",r.selfPct+"% · "+Math.round(r.used).toLocaleString()+" units"],
    ["Yearly saving",pkr(r.save)],["Payback",r.pay.toFixed(1)+" years"]];
  el.innerHTML=rows.map(x=>`<div class="r"><div class="l">${x[0]}</div><div class="v num ${x[1].length>16?"sm":""}">${x[1]}</div></div>`).join("")+
    `<p class="note" style="grid-column:1/-1">${Q.type==="off"?"Off-grid: saving is valued at the grid tariff; compare against diesel if the site runs a generator. Size the inverter and battery C-rate for motor starting current (pumps, compressors).":"Exported units ("+Math.round(r.exp).toLocaleString()+" a year) are credited at the buyback rate, not the retail tariff."} Year-1 figures. Panels lose about 0.5% output a year. Confirm with a site survey and shading check before quoting.</p>`;
}

  <div class="dhead"><div><h2>${esc(p.name)}</h2><div class="muted small">${esc(p.client)}${p.phone?" · "+esc(p.phone):""}</div></div><button class="btn ghost sm" data-act="close">Close</button></div>

  <div class="steps" aria-label="Stage">${STAGES.map((s,i)=>`<button class="${i<p.stage?"on":""} ${i===p.stage?"cur":""}" data-act="stage" data-id="${p.id}" data-v="${i}" title="${s.n}" aria-label="Move to ${s.n}"></button>`).join("")}</div>
  <div class="small"><b>${STAGES[p.stage].n}</b> <span class="muted">· ${daysIn(p)} days in this stage (limit ${STAGES[p.stage].sla})</span></div>
  <dl class="kv"><dt>Location</dt><dd>${esc(p.city)}${p.disco?" · "+esc(p.disco):""}</dd><dt>System</dt><dd class="num">${p.kw} kW</dd><dt>Value</dt><dd class="num">${pkr(p.price)}</dd><dt>Target finish</dt><dd>${fmtDate(p.target)}</dd><dt>Progress</dt><dd class="num">${prog(p)}% of tasks</dd></dl>
  <div class="sec"><h3>Payments <span class="muted small" style="font-family:var(--f-body);font-weight:400">${pkr(collected(p))} of ${pkr(p.price)}</span></h3>
   ${p.payments.map((x,i)=>`<label class="pay"><span><input type="checkbox" data-act="paid" data-id="${p.id}" data-i="${i}" ${x.paid?"checked":""}> ${esc(x.label)} <span class="muted small">${x.pct}%</span></span><span class="num">${pkr(p.price*x.pct/100)}</span></label>`).join("")}</div>
  <div class="sec"><h3>Margin <span class="muted small" style="font-family:var(--f-body);font-weight:400">forecast ${marginPct(p).toFixed(1)}% · budget ${budgetMargin(p).toFixed(1)}% · target ${S.settings.targetMargin}%</span></h3>
   <div class="crow h"><span>Cost</span><span style="text-align:right">Budget</span><span style="text-align:right">Actual</span></div>
   ${p.costs.map((c,i)=>`<div class="crow"><span>${esc(c.label)}</span><input type="number" min="0" step="1000" data-act="cost" data-f="budget" data-id="${p.id}" data-i="${i}" value="${c.budget}" aria-label="${esc(c.label)} budget"><input type="number" min="0" step="1000" data-act="cost" data-f="actual" data-id="${p.id}" data-i="${i}" value="${c.actual||""}" placeholder="not yet" aria-label="${esc(c.label)} actual"></div>`).join("")}
   <div class="crow" style="font-weight:600"><span>Total cost</span><span class="num" style="text-align:right">${pkr(p.costs.reduce((a,c)=>a+c.budget,0))}</span><span class="num" style="text-align:right">${pkr(forecast(p))}</span></div>
   <p class="small muted" style="margin:8px 0 0">Forecast uses the actual cost where you entered one and the budget where you have not. Profit now: <b class="num">${pkr(p.price-forecast(p))}</b> <span class="pill ${lowMargin(p)?"bad":"good"}">${marginPct(p).toFixed(1)}%</span></p></div>
  <div class="sec"><h3>Client update</h3>
   <div class="fields" style="grid-template-columns:1fr 1fr">
    <label class="f">Message<select id="m-stage"><option value="status" ${msgStage==="status"?"selected":""}>Status summary</option>${STAGES.map((s,i)=>`<option value="${i}" ${(msgStage==="auto"?p.stage:msgStage)===i||String(msgStage)===String(i)?"selected":""}>${s.n}</option>`).join("")}</select></label>

   <p class="small muted" style="margin:8px 0 0">${p.phone?`Sends to ${esc(p.phone)}.`:"Add a phone number to the project to pre-fill the recipient."} You can edit the text before sending. Nothing is sent from this page.</p></div>
  <div class="sec"><h3>Tasks</h3>${byStage.map(g=>`<div class="gh" style="margin-top:12px">${g.s.n}${g.i===p.stage?` <span class="pill warn">current</span>`:""}</div>${g.ts.map(t=>trow(t,p,false)).join("")}`).join("")}
   <div class="addtask"><input id="nt-text" placeholder="Add a task for the current stage" aria-label="New task"><select id="nt-role" aria-label="Team" style="background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 8px">${ROLES.map(r=>`<option>${r}</option>`).join("")}</select><button class="btn sm" data-act="addtask" data-id="${p.id}">Add</button></div></div>
  <div class="sec"><h3>Notes</h3><textarea id="notes" data-id="${p.id}" aria-label="Notes" placeholder="Site issues, client requests, DISCO reference numbers">${esc(p.notes)}</textarea></div>

  </aside>`;
}
function newForm(prefill){
  const v=prefill||{};
  return `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-label="New project">
  <div class="dhead"><h2>New project</h2><button class="btn ghost sm" data-act="close">Close</button></div>
  <div class="fields" style="grid-template-columns:1fr 1fr">
   <label class="f" style="grid-column:1/-1">Project name<input id="n-name" placeholder="e.g. Khan House 8 kW" value="${esc(v.name||"")}"></label>
   <label class="f">Client name<input id="n-client"></label>
   <label class="f">Phone<input id="n-phone" placeholder="03xx-xxxxxxx"></label>
   <label class="f">City<select id="n-city">${Object.keys(CITIES).map(c=>`<option>${c}</option>`).join("")}</select></label>

   <label class="f">System type<select id="n-type">${Object.keys(TYPES).map(k=>`<option value="${k}" ${v.type===k?"selected":""}>${TYPES[k]}</option>`).join("")}</select></label>
   <label class="f">Size (kW)<input id="n-kw" type="number" min="0" step="0.5" value="${v.kw||""}"></label>
   <label class="f">Contract value (PKR)<input id="n-price" type="number" min="0" value="${v.price||""}"></label>
   <label class="f" style="grid-column:1/-1">Target finish<input id="n-target" type="date" value="${addDays(45)}"></label>
  </div><div style="margin-top:16px"><button class="btn" data-act="create">Create project</button></div></aside>`;
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act, P=id=>S.projects.find(p=>p.id===id);
  if(a==="tab"){view=el.dataset.v;render()}
  else if(a==="seg"){filterSeg=el.dataset.v;render()}
  else if(a==="reconnect"){dbRef=false;clearInterval(pollTimer);connectDb(true)}
  else if(a==="open"){e.stopPropagation();openId=el.dataset.id;msgStage="auto";drawer()}
  else if(a==="close"){openId=null;drawer()}
  else if(a==="new"){openId="new";drawer()}
  else if(a==="backup"){const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),u=URL.createObjectURL(b),l=document.createElement("a");l.href=u;l.download="dhoop-backup-"+today()+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast("Backup downloaded")}
  else if(a==="copy"){const t=$("#m-text");navigator.clipboard.writeText(t.value).then(()=>toast("Message copied"),()=>{t.select();toast("Press Ctrl+C to copy")})}
  else if(a==="clear"){S.projects=S.projects.filter(p=>!p.ex);S.sample=false;save();render();toast("Examples cleared")}
  else if(a==="stage"){const p=P(el.dataset.id);p.stage=+el.dataset.v;p.stageDate=today();msgStage="auto";save();render();toast("Moved to "+STAGES[p.stage].n)}
  else if(a==="addtask"){const p=P(el.dataset.id),tx=$("#nt-text").value.trim();if(!tx)return;p.tasks.push({id:uid(),text:tx,stage:p.stage,role:$("#nt-role").value,due:addDays(3),done:false});save();render()}
  else if(a==="del1"){el.textContent="Click again to delete";el.dataset.act="del2";el.classList.remove("ghost");el.classList.add("danger")}
  else if(a==="del2"){S.projects=S.projects.filter(p=>p.id!==el.dataset.id);openId=null;save();render();toast("Project deleted")}
  else if(a==="quote2project"){const r=quoteNums();Q.pre={kw:r.kw,price:Math.round(r.cost/1000)*1000,seg:Q.seg,type:Q.type};openId="new";$("#overlay").innerHTML=newForm(Q.pre)}
  else if(a==="create"){
    const name=$("#n-name").value.trim(),kw=+$("#n-kw").value;
    if(!name||!kw){toast("Enter a project name and size");return}
    const seg=$("#n-seg").value, city=$("#n-city").value;
    const price=+$("#n-price").value||Math.round(kw*S.settings.rate[seg]/1000)*1000;
    const p=mkProject({name,client:$("#n-client").value.trim()||name,phone:$("#n-phone").value.trim(),city,seg,kw,type:$("#n-type").value,price,stage:0,days:0,age:0,seed:0});
    p.disco=$("#n-disco").value.trim()||CITIES[city];p.target=$("#n-target").value||p.target;
    S.projects.unshift(p);S.sample&&0;save();openId=p.id;view="board";render();toast("Project created");
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList.contains("card"))e.target.click();if(e.key==="Escape"&&openId){openId=null;drawer()}});
document.addEventListener("change",e=>{
  const el=e.target,a=el.dataset.act;
  if(a==="tick"){const p=S.projects.find(x=>x.id===el.dataset.p),t=p.tasks.find(x=>x.id===el.dataset.t);t.done=el.checked;save();const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==="paid"){const p=S.projects.find(x=>x.id===el.dataset.id);p.payments[+el.dataset.i].paid=el.checked;save();const d=$(".drawer");const y=d?d.scrollTop:0;render();const d2=$(".drawer");if(d2)d2.scrollTop=y}
  else if(el.id==="notes"){S.projects.find(x=>x.id===el.dataset.id).notes=el.value;save()}
  else if(el.id==="role"){taskRole=el.value;render()}
  else if(a==="cost"){const p=S.projects.find(x=>x.id===el.dataset.id);p.costs[+el.dataset.i][el.dataset.f]=Math.max(0,+el.value||0);save();const d=$(".drawer"),y=d?d.scrollTop:0;render();const d2=$(".drawer");if(d2)d2.scrollTop=y}
  else if(el.id==="m-stage"||el.id==="m-lang"){
    if(el.id==="m-stage")msgStage=el.value==="status"?"status":+el.value;else msgLang=el.value;
    const p=S.projects.find(x=>x.id===openId),t=clientMsg(p);$("#m-text").value=t;$("#m-wa").href=waHref(p,t)}
  else if(el.id==="n-city"){$("#n-disco").value=CITIES[el.value]||""}
  else if(el.id==="restore"&&el.files[0]){
    el.files[0].text().then(tx=>{
      const d=JSON.parse(tx);
      if(!d||!Array.isArray(d.projects)||!d.settings)throw 0;
      if(!confirm("Replace all current data with this backup ("+d.projects.length+" projects)?"))return;
      S=d;migrate(S);openId=null;save();render();toast("Backup restored");
    }).catch(()=>toast("That file is not a Dhoop backup")).finally(()=>{el.value=""});
  }
});
document.addEventListener("input",e=>{
  const el=e.target,id=el.id;
  if(id==="m-text"){const p=S.projects.find(x=>x.id===openId);$("#m-wa").href=waHref(p,el.value)}
  else if(id==="q"){search=el.value;$("#board").innerHTML=boardHtml()}
  else if(id==="q-units"){Q.units=+el.value||0;calcQuote()}
  else if(id==="q-seg"){Q.seg=el.value;calcQuote()}
  else if(id==="q-type"){Q.type=el.value;calcQuote()}
  else if(id&&id.startsWith("s-")){
    const s=S.settings,v=+el.value||0;
    ({"s-res":()=>s.rate.res=v,"s-com":()=>s.rate.com=v,"s-ind":()=>s.rate.ind=v,"s-upk":()=>s.unitsPerKw=Math.max(1,v),"s-tar":()=>s.tariff=v,"s-exp":()=>s.exportRate=v,"s-bat":()=>s.battRate=v,"s-pw":()=>s.panelW=Math.max(100,v),"s-tm":()=>s.targetMargin=v})[id]();
    calcQuote();save();
  }
});

/* ---------- boot ---------- */
S=loadLocal()||sampleData();
if(migrate(S))save();
render();
initDb();
</script>
